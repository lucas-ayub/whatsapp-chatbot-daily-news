name: Daily digest

on:
  schedule:
    # GitHub cron is UTC-only: one run per German DST offset. The script sends
    # only from the run that maps to SEND_LOCAL_TIME (07:55 Berlin).
    - cron: "55 5 * * *"   # summer (CEST, UTC+2)
    - cron: "55 6 * * *"   # winter (CET, UTC+1)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the message in the logs (don't send to WhatsApp)"
        type: boolean
        default: true
      date:
        description: "Optional date YYYY-MM-DD (default: today in Brazil)"
        type: string
        required: false

permissions:
  contents: read
  actions: write  # used by the keep-alive step below

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build and send digest
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIGEST_DATE: ${{ inputs.date }}
        run: |
          args=()
          [ -n "$SCHEDULE" ] && args+=(--schedule "$SCHEDULE")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$DIGEST_DATE" ] && args+=(--date "$DIGEST_DATE")
          python -m digest.main "${args[@]}"

      # GitHub disables scheduled workflows in public repos after 60 days without commits.
      # Re-enabling the workflow through the API resets that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
