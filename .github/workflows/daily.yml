name: Daily digest

on:
  # Two alarm clocks, both "scheduled" runs (send only after 07:55 Berlin, once a day
  # thanks to the cache marker, so whichever fires first wins):
  #  1. the Cloudflare Worker's Cron Triggers (relay/callmebot-worker.js), which call
  #     this workflow with scheduled=true -- punctual, the main one;
  #  2. GitHub's own cron below -- best-effort and often hours late or skipped, a backup.
  schedule:
    - cron: "55 5 * * *"   # 07:55 in summer (CEST)
    - cron: "55 6 * * *"   # 07:55 in winter (CET)
    - cron: "25 7 * * *"   # retries, in case the runs above are dropped
    - cron: "55 7 * * *"
    - cron: "55 8 * * *"
    - cron: "55 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the message in the logs (don't send to WhatsApp)"
        type: boolean
        default: true
      date:
        description: "Optional date YYYY-MM-DD (default: today in Brazil)"
        type: string
        required: false
      probe:
        description: "Debug: send only this text to WhatsApp (\\n = new line)"
        type: string
        required: false
      scheduled:
        description: "Internal: behave like the daily schedule (used by the Cloudflare trigger)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write  # keep-alive step and the daily "already sent" cache marker

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Today's date (send time zone)
        id: day
        run: |
          echo "date=$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; from digest import config; print(datetime.now(ZoneInfo(config.SEND_TZ)).date())')" >> "$GITHUB_OUTPUT"

      - name: Already sent today?
        id: sent
        if: github.event_name == 'schedule' || inputs.scheduled
        uses: actions/cache/restore@v4
        with:
          path: .sent-marker
          key: digest-sent-${{ steps.day.outputs.date }}

      - name: Install dependencies
        if: steps.sent.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Run tests
        if: steps.sent.outputs.cache-hit != 'true'
        run: pytest -q

      - name: Build and send digest
        if: steps.sent.outputs.cache-hit != 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}            # e-mail delivery (preferred)
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          CALLMEBOT_URL: ${{ secrets.CALLMEBOT_URL }}  # optional relay, see README
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          SCHEDULE: ${{ github.event.schedule || (inputs.scheduled && 'cloudflare-cron' || '') }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIGEST_DATE: ${{ inputs.date }}
          PROBE: ${{ inputs.probe }}
        run: |
          if [ -n "$PROBE" ]; then python -m digest.main --probe "$PROBE"; exit $?; fi
          args=(--sent-marker .sent-marker)
          [ -n "$SCHEDULE" ] && args+=(--schedule "$SCHEDULE")
          [ "$DRY_RUN" = "true" ] && [ -z "$SCHEDULE" ] && args+=(--dry-run)
          [ -n "$DIGEST_DATE" ] && args+=(--date "$DIGEST_DATE")
          python -m digest.main "${args[@]}"

      - name: Remember that today's digest was sent
        if: hashFiles('.sent-marker') != ''
        uses: actions/cache/save@v4
        with:
          path: .sent-marker
          key: digest-sent-${{ steps.day.outputs.date }}

      # GitHub disables scheduled workflows in public repos after 60 days without commits.
      # Re-enabling the workflow through the API resets that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule' || inputs.scheduled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
